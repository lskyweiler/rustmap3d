[package]
name = "rustmap3d"
authors = [
    "Lucas Weiler <lucas.l.weiler@leidos.com>",
    "Andrew Molnar <andrew.b.molnar@leidos.com>",
]
edition = "2021"
description = "Python geodetic coordinate conversion library written in rust"
keywords = ["geodetic", "engineering", "scientific", "gis"]
license-file = "LICENSE"
homepage = "https://github.com/lskyweiler/rustmap3d"
repository = "https://github.com/lskyweiler/rustmap3d"
readme = "README.md"
version = "0.2.3"

[workspace]
members = ["crates/*"]

[workspace.package]
edition = "2021"
version = "0.2.3"

[workspace.dependencies]
map3d = { path = "crates/map3d" }
pymap3d = { path = "crates/pymap3d" }

pyglam = { git = "https://github.com/lskyweiler/pyglam", branch = "feat/py-bevy" }

either = "1.15"
glam = "~0.30"
pyo3 = { version = "~0.27", features = [
    "either",
    "extension-module",
    "generate-import-lib",
] }
pyo3-stub-gen = { version = "~0.18", default-features = false, features = [
    "either",
] }

[lib]
# rlib is required to generate py-stubs
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
map3d.workspace = true
pymap3d.workspace = true
pyo3.workspace = true
glam.workspace = true

# bin/stub_gen deps
env_logger = "~0.11"
pyo3-stub-gen.workspace = true
pyglam.workspace = true

[profile.release]
# https://github.com/johnthagen/min-sized-rust
strip = true # Automatically strip symbols from the binary.

[features]
py_bevy = ["map3d/py_bevy", "pyglam/py_bevy"]