[package]
name = "map3d"
description = "Geodetic coordinate conversion library"
keywords = ["geodetic", "engineering", "scientific", "gis"]
license-file = "../../LICENSE"
homepage = "https://github.com/lskyweiler/rustmap3d"
repository = "https://github.com/lskyweiler/rustmap3d"
readme = "README.md"
version.workspace = true
edition.workspace = true

[dependencies]
glam.workspace = true
almost = "~0.2"
rand = "0.10"
chrono = "~0.4"
approx = "~0.5"
rand_distr = "0.6"
rayon.workspace = true

either.workspace = true
pyo3 = { workspace = true, optional = true }
pyo3-stub-gen = { workspace = true, optional = true }

# NOTE: simple-py-bevy `main` is still on pyo3 0.27; Cargo.lock pins this (and pyglam's
# transitive copy) to the pyo3 0.29 commit f0c1d17 on its `develop` branch. If a full
# `cargo update` re-resolves it to main, restore with:
#   cargo update -p simple-py-bevy --precise f0c1d17dd8da22d10f49f83b296dc3927566dd40
simple-py-bevy = { git = "https://github.com/lskyweiler/simple-py-bevy", optional = true }
# Pinned to pyglam 0.3.0 (pyo3 0.29, glam 0.32). pyo3 is NOT enabled here so that
# pure-Rust consumers of map3d do not link pyo3; the `pyo3` feature below forwards it.
pyglam = { git = "https://github.com/lskyweiler/pyglam", rev = "01809c0d946afa98897655b82520062d9d12e64e", default-features = false }

bevy = { workspace = true, optional = true }
serde = { version = "~1.0", features = ["derive"], optional = true }
serde_json = { version = "~1.0", optional = true }

map3d_derive = { path = "../map3d_derive" }

[dev-dependencies]
rstest = "0.26"
criterion = { version = "~0.8", features = ["html_reports"] }

[[bench]]
name = "geobench"
harness = false

[lib]
doctest = false

[features]
# generate pyo3 functions at all
pyo3 = ["dep:pyo3", "dep:pyo3-stub-gen", "pyglam/pyo3"]
pydantic-serde = []
serde = ["dep:serde", "dep:serde_json", "pyglam/serde"]
# only bevy functionality
bevy = ["dep:bevy", "serde", "pyglam/bevy"]
# generate to_owned method
gen-to-owned-stubs = [
    "simple-py-bevy/gen-to-owned-stubs",
    "dep:pyo3",
    "dep:pyo3-stub-gen",
]
# bevy and py ref functionality
py-bevy = [
    "pyo3",
    "bevy",
    "gen-to-owned-stubs",
    "pyglam/py-ref",
    "dep:simple-py-bevy",
    "simple-py-bevy/py-bevy",
    "simple-py-bevy/py-ref",
    "simple-py-bevy/gen-to-owned-stubs",
]
# need to set rustmap3d to allow pickling, but you may not want this downstream
set-pyclass-module = []
